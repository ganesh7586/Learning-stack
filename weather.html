<!DOCTYPE html>
<htlm>
    <head>
        <title>Weather Search</title>
        <link rel="stylesheet" href="weather.css">
    </head>
    <body>
        <div id="box">
        <div id="ser" class="ser">
            <input id="in" type="text" placeholder="enter county name">
            <button id="but">🔍</button>
        </div>
        <div class="cont">
            <img height="150px" id="icon" src="pics/drizzle.png">
            <p id="rep">cloudy</p>
            <p id="temp">52°C</p>
            <p id="city">New York</p>
        </div>
        <div class="down">
            <img id="im" src="pics/humidity.png">
            <p id="hum">53%</p>
            <img id="im" src="pics/image.png">
            <p id="wsp">5km</p>
        </div>
        </div>
        <script src="weather.js"></script>
    </body>
</htlm>
